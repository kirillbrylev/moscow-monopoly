<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор риелтора</title>
<!-- Вознаграждение риелтора: фикс + % сверх базы.
     Открыть файл в браузере (двойной клик). Ничего не отправляет, считает на странице. -->
<style>
:root{--fg:#1d1d1f;--bg:#f5f5f4;--card:#fff;--line:#e0ded9;--muted:#6b6b6b;--acc:#1f4e79;--hi:#eef5ee}
@media(prefers-color-scheme:dark){:root{--fg:#ececec;--bg:#17181a;--card:#222326;--line:#3a3b3f;--muted:#a0a0a0;--acc:#7fb0e0;--hi:#23332a}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:640px;margin:auto}
h1{font-size:20px;margin:0 0 4px}
.m{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
input{font:inherit;width:110px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:right}
.big{font-size:26px;font-weight:600}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:var(--hi);font-weight:600}
</style>
</head>
<body><main>
<h1>Калькулятор вознаграждения риелтора</h1>
<p class="m">Риелтору = фикс + % от цены в ДКП сверх базы. Ниже базы — только фикс. Суммы в млн ₽, вознаграждение — в тыс ₽.</p>

<div class="card">
  <label>Цена по ДКП, млн ₽ <input id="price" type="number" step="0.1" value="39"></label>
  <label>База премии, млн ₽ <input id="base" type="number" step="0.1" value="39"></label>
  <label>Премия, % сверх базы <input id="pct" type="number" step="1" value="20"></label>
  <label>Фикс риелтору, тыс ₽ <input id="fix" type="number" step="10" value="300"></label>
  <label>Юрист, тыс ₽ <input id="law" type="number" step="10" value="100"></label>
</div>

<div class="card">
  <div class="m">Риелтору</div>
  <div class="big" id="fee"></div>
  <div class="m" id="feeNote"></div>
  <div style="margin-top:10px">
    <div class="row"><span>Риелтор + юрист</span><b id="total"></b></div>
    <div class="row"><span>На руки после риелтора и юриста</span><b id="net"></b></div>
  </div>
</div>

<div class="card">
  <div class="m" style="margin-bottom:6px">Та же схема при других ценах</div>
  <table><thead><tr><th>Цена ДКП</th><th>Риелтору</th><th>% от цены</th><th>На руки</th></tr></thead><tbody id="tbl"></tbody></table>
</div>
</main>
<script>
const $ = id => document.getElementById(id);
const num = id => parseFloat(String($(id).value).replace(',', '.')) || 0;
const r = (x, d = 0) => x.toLocaleString('ru-RU', {minimumFractionDigits: d, maximumFractionDigits: d});
function fee(price, base, pct, fix) { return fix + pct / 100 * Math.max(0, price - base) * 1000; } // тыс ₽
function calc() {
  const price = num('price'), base = num('base'), pct = num('pct'), fix = num('fix'), law = num('law');
  const f = fee(price, base, pct, fix);
  $('fee').textContent = r(f) + ' тыс ₽';
  $('feeNote').textContent = price > base
    ? `${r(fix)} фикс + ${r(pct)}% × ${r(price - base, 1)} млн = ${r(fix)} + ${r(f - fix)}; ${r(f / price / 10, 2)}% от цены`
    : `цена не выше базы — только фикс; ${r(f / price / 10, 2)}% от цены`;
  $('total').textContent = r(f + law) + ' тыс ₽';
  $('net').textContent = r(price - (f + law) / 1000, 2) + ' млн ₽';
  const start = Math.floor(Math.min(price, base)) - 1, rows = [];
  for (let p = start; p <= start + 5; p += 0.5) {
    const x = fee(p, base, pct, fix);
    rows.push(`<tr${Math.abs(p - price) < 1e-9 ? ' class="cur"' : ''}><td>${r(p, 1)}</td><td>${r(x)}</td><td>${r(x / p / 10, 2)}%</td><td>${r(p - (x + law) / 1000, 2)}</td></tr>`);
  }
  $('tbl').innerHTML = rows.join('');
}
document.querySelectorAll('input').forEach(i => i.addEventListener('input', calc));
calc();
</script>
</body></html>
